general {
    gaps_in = 1
    gaps_out = 0 1 1 1
    border_size = 2
    col.active_border = $color2 $color4 45deg
    col.inactive_border = $background
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes
    bezier = rapid, 0.0, 0.5, 0.0, 1.0
    animation = windows, 1, 0.8, rapid, slide
    animation = windowsOut, 1, 0.8, rapid, slide
    animation = border, 1, 1, default
    animation = fade, 1, 0.5, default
    animation = workspaces, 1, 0.8, rapid, slide
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}